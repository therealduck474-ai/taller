<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Admin</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: white; padding: 2rem; }
        .container { max-width: 800px; margin: auto; background: #1e293b; padding: 2rem; border-radius: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { border: 1px solid #334155; padding: 12px; text-align: left; }
        th { background: #0f172a; color: #10b981; }
        .btn-borrar { background: #ef4444; color: white; border: none; padding: 5px 10px; cursor: pointer; border-radius: 4px;}
        .btn-editar { background: #eab308; color: #0f172a; font-weight: bold; border: none; padding: 5px 10px; cursor: pointer; border-radius: 4px; margin-right: 8px;}
        .btn-act { background: #3b82f6; color: white; padding: 10px; border: none; border-radius: 4px; cursor: pointer;}
    </style>
</head>
<body>
    <div class="container">
        <h1>Centro de Control REST</h1>
        <button class="btn-act" onclick="cargarDatos()">🔄 Extraer Datos (GET)</button>
        <table>
            <thead><tr><th>Matrícula</th><th>Nombre</th><th>Fecha</th><th>Acciones</th></tr></thead>
            <tbody id="tabla-body"></tbody>
        </table>
    </div>
    <script>
        const URL = "https://restful.therealduck474.workers.dev/"; // Reemplaza aquí
        
        async function cargarDatos() {
            const tbody = document.getElementById("tabla-body");
            const res = await fetch(URL);
            const datos = await res.json();
            tbody.innerHTML = "";
            datos.forEach(r => {
                tbody.innerHTML += `<tr>
                    <td>${r.matricula}</td>
                    <td>${r.nombre}</td>
                    <td>${r.fecha}</td>
                    <td>
                        <button class="btn-editar" onclick="editar('${r.matricula}', '${r.nombre}')">✏️ Editar</button>
                        <button class="btn-borrar" onclick="borrar('${r.matricula}')">🗑️ Eliminar</button>
                    </td>
                </tr>`;
            });
        }

        async function editar(matricula, nombreActual) {
            const nuevoNombre = prompt(`Ingresa el nuevo nombre para la matrícula ${matricula}:`, nombreActual);
            if (nuevoNombre && nuevoNombre !== nombreActual) {
                await fetch(URL, {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ matricula: matricula, nombre: nuevoNombre })
                });
                cargarDatos();
            }
        }

        async function borrar(matricula) {
            if(confirm(`¿Seguro que deseas borrar la matrícula ${matricula}?`)) {
                await fetch(`${URL}?matricula=${matricula}`, { method: "DELETE" });
                cargarDatos();
            }
        }
    </script>
</body>
</html>
